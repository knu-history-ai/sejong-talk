name: PR title and issue

on:
  pull_request:
    branches: [dev, main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title-check:
    name: pr-title-check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v9
        name: Check title and opening issue section
        with:
          script: |
            let pr = context.payload.pull_request;
            // GITHUB_TOKEN body edits do not trigger edited workflows again.
            // Give the separate trusted metadata job time to create the issue;
            // fail normally if linking never completes, rather than bypassing it.
            if (pr.user.login === 'dependabot[bot]' &&
                pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`) {
              const deadline = Date.now() + 90_000;
              do {
                ({ data: pr } = await github.rest.pulls.get({
                  ...context.repo, pull_number: pr.number,
                }));
                if (/^## 📌 관련된 이슈 \(Issue Number\)\n\n- Resolves #[1-9]\d*\n/.test(pr.body ?? '')) break;
                if (pr.state !== 'open' || Date.now() >= deadline) break;
                await new Promise(resolve => setTimeout(resolve, 3000));
              } while (true);
            }
            const { title, body } = pr;
            const valid = /^(feat|fix|docs|chore|test|refactor):\s+\S/.test(title);
            if (!valid) {
              core.setFailed('제목을 "feat: 음성 질문 입력"처럼 작성해 주세요.');
            }
            // Read text from the event; never interpolate PR content into code.
            const text = (body ?? '')
              .replace(/\r\n?/g, '\n')
              .replace(/<!--[\s\S]*?-->/g, '')
              .trim();
            const firstSection = text.split(/\n(?=#{1,6}\s)/, 1)[0];
            const [heading, ...lines] = firstSection.split('\n');
            const issues = lines.map(line => line.trim()).filter(Boolean);
            const validIssues = heading === '## 📌 관련된 이슈 (Issue Number)' &&
              issues.length > 0 && issues.every(line => /^- Resolves #[1-9]\d*$/.test(line));
            if (!validIssues) {
              core.setFailed('PR 본문 최상단을 "## 📌 관련된 이슈 (Issue Number)"로 시작하고, 다음 줄에 "- Resolves #실제이슈번호"를 적어 주세요. 여러 이슈는 한 줄씩 작성합니다.');
            }
